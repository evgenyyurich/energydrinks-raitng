<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Рейтинг энергетиков</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="logo" href="/">⚡ Энергетики</a>
        <button class="btn btn--ghost" type="button" disabled title="Появится в v0.3">Войти</button>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Рейтинг энергетиков</h1>
        <p class="muted">Оценки от меня и друзей. Средний балл по всем, кто попробовал.</p>
      </section>

      <section class="controls">
        <input id="search" class="input" type="search" placeholder="Поиск по названию или бренду" autocomplete="off" />
        <select id="sort" class="input">
          <option value="rating">По рейтингу</option>
          <option value="votes">По числу оценок</option>
          <option value="name">По названию</option>
          <option value="caffeine">По кофеину</option>
        </select>
      </section>

      <ol id="list" class="list"></ol>
      <p id="empty" class="muted empty" hidden>Ничего не нашлось.</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
